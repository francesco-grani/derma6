[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "skincare-routine-builder"
version = "0.1.0"
description = "Conversational RAG chatbot for male skincare beginners"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "Francesco Grani", email = "grani.francesco@gmail.com"}
]

dependencies = [
    "langchain>=1.3.1",
    "langchain-community>=0.4.1",
    "langchain-openai>=1.2.1",
    "chromadb>=1.5.9",
    "sqlalchemy>=2.0.49",
    "pydantic-settings>=2.14.1",
    "streamlit>=1.57.0",
    "openai>=2.37.0",
    "python-dotenv>=1.2.2",
    "sentry-sdk>=2.60.0",
    "ragas>=0.4.3",
    "httpx>=0.28.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.3",
    "pytest-cov>=7.1.0",
    "pytest-asyncio>=0.26.0",
]

[project.urls]
Homepage = "https://github.com/fgrani/skincare-routine-builder"
Repository = "https://github.com/fgrani/skincare-routine-builder"

[tool.hatch.build.targets.wheel]
packages = ["backend", "frontend"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v"
asyncio_mode = "auto"
