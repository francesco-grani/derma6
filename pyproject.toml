[project]
name = "fgrani-ae-3-6"
version = "0.1.0"
description = "Add your description here"
requires-python = ">=3.12"
dependencies = [
    "chromadb>=1.5.9",
    "fastapi>=0.115",
    "langchain-community>=0.4.2",
    "langchain-core>=1.4.7",
    "langchain-openai>=1.3.2",
    "langgraph>=0.2",
    "langsmith>=0.8.16",
    "onnxruntime<=1.19.2",
    "rank-bm25>=0.3.1",
    "sentence-transformers>=3.0",
    "openai>=2.42.0",
    "pydantic-settings>=2.0",
    "python-dotenv>=1.2.2",
    "python-jose[cryptography]>=3.5.0",
    "python-multipart>=0.0.32",
    "sentry-sdk>=2.63.0",
    "sqlalchemy>=2.0",
    "uvicorn[standard]>=0.30",
    "xhtml2pdf>=0.2.16",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-asyncio>=0.23",
    "deepeval>=2.0",
]

[tool.pytest.ini_options]
testpaths = ["tests", "eval"]
addopts = "--tb=short -q"
asyncio_mode = "auto"
filterwarnings = [
    # deepeval uses asyncio.get_event_loop() which is deprecated in Python 3.10+
    # when there is no running loop; asyncio_mode=auto creates one, but deepeval
    # still triggers the warning during its own import-time initialisation.
    "ignore::DeprecationWarning:deepeval",
]
markers = [
    "eval: deepeval LLM quality evaluations (require --run-eval flag and live API key)",
]

[dependency-groups]
dev = [
    "deepeval>=4.0.6",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
]

[tool.coverage.run]
source = ["backend"]
omit = [
    # FastAPI route handlers — thin wrappers, covered by integration tests
    "backend/api/*",
    "backend/main.py",
    # Infrastructure / bootstrapping
    "backend/logging_config.py",
    "backend/middleware/*",
    "backend/auth.py",
    # LangGraph Studio config (not production code path)
    "backend/agent/studio.py",
    # Session/chat persistence — thin wrappers around LangChain/SQLAlchemy
    "backend/db/session_store.py",
    "backend/db/chat_history.py",
    # LangGraph streaming (requires live LLM + graph runtime)
    "backend/agent/graph.py",
]

[tool.coverage.report]
show_missing = true
skip_covered = false
fail_under = 90
