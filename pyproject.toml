[project]
name = "fgrani-ae-cap-afa-1-1"
version = "0.1.0"
description = "Add your description here"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.13",
    "beautifulsoup4>=4.12",
    "chromadb>=1.5.9",
    "ddgs>=9.0",  # DuckDuckGo backend for the RAG web-search fallback (no API key)
    "fastapi>=0.115",
    "httpx>=0.27",
    "langchain-community>=0.4.2",
    "langchain-core>=1.4.7",
    "langchain-openai>=1.3.2",
    "langgraph>=0.2",
    "langgraph-checkpoint-postgres>=2.0",
    "langsmith>=0.8.16",
    "lxml>=5.0",
    "numpy<2; sys_platform == 'darwin' and platform_machine == 'x86_64' and python_full_version < '3.13'",
    "onnxruntime<=1.19.2",
    "psycopg[binary,pool]>=3.1",
    "rank-bm25>=0.2.2",
    "sentence-transformers>=3.0",
    "torch>=2.2",
    "transformers>=4.40,<5.0",
    "openai>=2.42.0",
    "pgvector>=0.3",
    "pydantic-settings>=2.0",
    "python-dotenv>=1.2.2",
    "python-jose[cryptography]>=3.5.0",
    "python-multipart>=0.0.32",
    "sentry-sdk>=2.63.0",
    "sqlalchemy>=2.0",
    "uvicorn[standard]>=0.30",
    "vinted-api-wrapper>=0.3.9",
    "xhtml2pdf>=0.2.16",
    "brotlicffi>=1.2.0.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-asyncio>=0.23",
    "deepeval>=2.0",
]

[tool.pytest.ini_options]
testpaths = ["tests", "eval"]
addopts = "--tb=short -q"
asyncio_mode = "auto"
filterwarnings = [
    # deepeval uses asyncio.get_event_loop() which is deprecated in Python 3.10+
    # when there is no running loop; asyncio_mode=auto creates one, but deepeval
    # still triggers the warning during its own import-time initialisation.
    "ignore::DeprecationWarning:deepeval",
]
markers = [
    "eval: deepeval LLM quality evaluations (require --run-eval flag and live API key)",
    "pgvector: pgvector integration tests (require --run-pgvector flag and a live Postgres with vector available)",
]

[dependency-groups]
dev = [
    "deepeval>=4.0.6",
    "langgraph-cli[inmem]>=0.4.31",
    # LangSmith Studio requires langgraph-api >= 0.11.0 for in-Studio tracing.
    # langgraph-cli only floors it at 0.5.35, and the resolver otherwise prefers
    # newer grpcio/opentelemetry over a newer langgraph-api, silently pinning 0.7.27.
    "langgraph-api>=0.11.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
]

[tool.uv]
required-environments = [
    "sys_platform == 'darwin' and platform_machine == 'x86_64'",
]

# sentence-transformers pulls in torch transitively. Deployment is CPU-only
# (no GPU on the Hetzner host), but PyPI's default Linux wheel bundles the
# full CUDA/nvidia-cu13-* stack (~8GB+) regardless — pin to PyTorch's
# CPU-only index instead so the built image (and the disk it lives on)
# doesn't pay for hardware it never uses.
[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.coverage.run]
source = ["backend"]
omit = [
    # FastAPI route handlers — thin wrappers, covered by integration tests
    "backend/api/*",
    "backend/main.py",
    # Infrastructure / bootstrapping
    "backend/logging_config.py",
    "backend/middleware/*",
    "backend/auth.py",
    # LangGraph Studio config (not production code path)
    "backend/agent/studio.py",
    # Session/chat persistence — thin wrappers around LangChain/SQLAlchemy
    "backend/db/session_store.py",
    "backend/db/chat_history.py",
    "backend/db/memory_store.py",
    # LangGraph streaming (requires live LLM + graph runtime)
    "backend/agent/graph.py",
]

[tool.coverage.report]
show_missing = true
skip_covered = false
fail_under = 90
