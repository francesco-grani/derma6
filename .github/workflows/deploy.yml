name: Deploy

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend
        run: |
          cd frontend
          npm ci
          npm run build

      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.HETZNER_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ secrets.HETZNER_HOST }} >> ~/.ssh/known_hosts

      - name: Sync backend + config
        run: |
          rsync -az --delete \
            --exclude='.env' \
            --exclude='data/' \
            --exclude='logs/' \
            --exclude='www/' \
            --exclude='.venv/' \
            --exclude='__pycache__/' \
            --exclude='*.pyc' \
            --exclude='.claude/' \
            --exclude='frontend/' \
            --exclude='.deepeval/' \
            --exclude='.langgraph_api/' \
            -e "ssh -i ~/.ssh/deploy_key" \
            ./ root@${{ secrets.HETZNER_HOST }}:/app/

      - name: Sync frontend build
        run: |
          rsync -az --delete \
            -e "ssh -i ~/.ssh/deploy_key" \
            frontend/dist/ root@${{ secrets.HETZNER_HOST }}:/app/www/

      - name: Restart services
        run: |
          ssh -i ~/.ssh/deploy_key root@${{ secrets.HETZNER_HOST }} \
            "cd /app && docker compose up --build -d && docker compose ps"
