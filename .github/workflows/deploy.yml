name: Deploy

# Manual-only on this (private submission) repo — the workflow is kept here to
# demonstrate the CI/CD setup, but the actual live deployment runs from the
# public mirror (derma6) on every push to its main, so this repo doesn't also
# race a second deploy against the same Hetzner server. Trigger by hand via
# `gh workflow run deploy.yml` or the Actions tab's "Run workflow" button.
on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
        run: |
          cd frontend
          npm ci
          npm run build

      - name: Set up SSH
        # security-remediation Req 27.2, 27.3: no ssh-keyscan against this
        # runner — that result would be trusted on first use (TOFU), which
        # is exactly what's vulnerable to a MITM on this connection. The
        # host key below was captured out-of-band from an already-trusted
        # local ~/.ssh/known_hosts entry for the same Hetzner host (pinned
        # 2026-07-12), not from CI. It's public key material, not a secret,
        # so it's checked directly into the workflow rather than a repo
        # secret. Pre-populating known_hosts with only this entry means
        # OpenSSH's own default StrictHostKeyChecking refuses the connection
        # outright — before any rsync/ssh step below runs — if the server
        # ever presents a different key; HostKeyAlgorithms pins the specific
        # algorithm so the client can't be steered into negotiating a key
        # type this pinned entry doesn't cover.
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.HETZNER_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          echo "${{ secrets.HETZNER_HOST }} ecdsa-sha2-nistp256 AAAAE2VjZHNhLXNoYTItbmlzdHAyNTYAAAAIbmlzdHAyNTYAAABBBP7q3EnCHR5Z5ZgnHOntYCfbRWSklLkXRwrLVqpVt3LHMHbW/bnHZbKTLuF7BQxjzUHNm7ETF9GfQ5BNniKt538=" > ~/.ssh/known_hosts
          {
            echo "Host ${{ secrets.HETZNER_HOST }}"
            echo "  HostKeyAlgorithms ecdsa-sha2-nistp256"
            echo "  StrictHostKeyChecking yes"
          } > ~/.ssh/config
          chmod 600 ~/.ssh/config

      - name: Sync backend + config
        run: |
          rsync -az --delete \
            --exclude='.env' \
            --exclude='data/' \
            --exclude='logs/' \
            --exclude='www/' \
            --exclude='.venv/' \
            --exclude='__pycache__/' \
            --exclude='*.pyc' \
            --exclude='.claude/' \
            --exclude='frontend/' \
            --exclude='.deepeval/' \
            --exclude='.langgraph_api/' \
            -e "ssh -i ~/.ssh/deploy_key" \
            ./ root@${{ secrets.HETZNER_HOST }}:/app/

      - name: Sync frontend build
        run: |
          rsync -az --delete \
            -e "ssh -i ~/.ssh/deploy_key" \
            frontend/dist/ root@${{ secrets.HETZNER_HOST }}:/app/www/

      - name: Restart services
        run: |
          ssh -i ~/.ssh/deploy_key root@${{ secrets.HETZNER_HOST }} \
            "cd /app && docker compose up --build -d && docker compose ps"
